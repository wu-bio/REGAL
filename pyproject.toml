[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regal"
version = "0.1.0"
description = "Regional gene activity object analysis for spatial transcriptomics."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "anndata>=0.11,<0.12",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.3,<3",
    "pyarrow>=24,<25",
    "PyYAML>=6,<7",
    "scanpy>=1.11,<2",
    "scikit-misc>=0.5,<0.6",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "seaborn>=0.13,<0.14",
    "torch>=2.12,<3",
    "tqdm>=4.68,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.setuptools]
packages = ["RSS", "RSP", "RSMD", "Utils"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
